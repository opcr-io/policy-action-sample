name: policy-build-release

on:
  workflow_dispatch:
  push:
    tags:
    - '*'

jobs:
  release_policy:
    runs-on: ubuntu-latest
    name: build
    steps:

    - 
      uses: actions/checkout@v7
    - 
      name: Setup Regal
      uses: open-policy-agent/setup-regal@v1
      with:
        version: latest
    - 
      name: Lint
      run: regal lint --format github ./src
    - 
      name: Read policy config
      id: config
      uses: gertd/yaml-reader-action@v1
      with:
        file: .github/config-policy.yaml
    -
      name: Calc Tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          {{`${{ steps.config.outputs.repo }}`}}
        flavor: |
          latest=auto
        tags: |
          type=semver,pattern={{`{{version}}`}}
          # type=semver,pattern={{`{{major}}.{{minor}}`}}
          # type=semver,pattern={{`{{major}}`}}
    - 
      name: Policy Login
      id: policy-login
      uses: opcr-io/policy-login-action@v4
      with:
        server: steps.config.outputs.server
        username: steps.config.outputs.username
        password: ${{ secrets.POLICY_PUSH_KEY }}
    - 
      name: Policy Build
      id: policy-build
      uses: opcr-io/policy-build-action@v4
      with:
        src: src
        tag: ${{ steps.config.outputs.repo }}
        revision: "$GITHUB_SHA"
        rego_version: "rego.v1"
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    - 
      name: Policy Tag
      id: policy-tag
      uses: opcr-io/policy-tag-action@v4
      with:
        source_tag: ${{ steps.config.outputs.repo }}
        target_tags: ${{ steps.meta.outputs.target_tags }}
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    - 
      name: Policy Push
      id: policy-push
      uses: opcr-io/policy-push-action@v3
      with:
        tags: ${{ steps.meta.outputs.target_tags }}
      env:
        POLICY_DEFAULT_DOMAIN: ${{ steps.config.outputs.server }}
    - 
      name: Policy Remove
      id: policy-rm
      uses: opcr-io/policy-rm-action@v4
      with:
        tag: policy-test/policy-test:${{ steps.meta.outputs.target_tags }}
    - 
      name: Policy Pull
      id: policy-pull
      uses: opcr-io/policy-pull-action@v4
      with:
        tag: policy-test/policy-test:${{ steps.meta.outputs.target_tags }}
    - 
      name: Create out directory
      run: |
        mkdir -p $GITHUB_WORKSPACE/out
        ls -ali $GITHUB_WORKSPACE
    - 
      name: Policy Save
      id: policy-save
      uses: opcr-io/policy-save-action@v4
      with:
        tag: policy-test/policy-test:${{ steps.meta.outputs.target_tags }}
        file: $GITHUB_WORKSPACE/out/bundle.tar.gz
    - 
      name: Dump bundle
      run: |
        tar -tvf $GITHUB_WORKSPACE/out/bundle.tar.gz
    - 
      name: Policy Logout
      id: policy-logout
      uses: opcr-io/policy-logout-action@v4
